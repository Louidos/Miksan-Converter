[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "miksan-converter"
version = "0.0.0"
description = "Leichtes Open-Source-Kommandozeilentool zum Umwandeln und Bearbeiten von Bildern"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Louidos" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = ["Pillow>=11.3", "pillow-heif>=0.22"]

[project.optional-dependencies]
svg = ["resvg-py>=0.2"]
raw = ["rawpy>=0.21"]
ki = ["rembg[cpu]>=2.0.60"]

[project.scripts]
miksan = "miksan_converter.cli:main"

[project.urls]
Quellcode = "https://github.com/Louidos/Miksan-Converter"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/miksan_converter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: langsamer Test mit echtem KI-Modell (nur mit --slow, nicht in der CI)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
